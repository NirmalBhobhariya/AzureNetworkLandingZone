name: Terraform CI

on:
  push:
    branches:
      - feature/github-action-pipeline
  pull_request:
    branches:
      - feature/github-action-pipeline

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environment/preprod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform fmt
        run: terraform fmt -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan -out=tfplan -input=false -no-color 2>&1 | tee plan_info.txt

      - name: Upload plan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            environment/preprod/plan_info.txt
            environment/preprod/tfplan
